<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>১০০ টাকা গিফট ভাউচার</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&amp;family=Playfair+Display:wght@700&amp;display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      font-family: 'Noto Sans Bengali', sans-serif;
    }

    .voucher {
      width: 700px;
      height: 420px;
      background: linear-gradient(135deg, #0d3b2e 0%, #1a5c45 40%, #c9a227 100%);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      color: #f5e6b8;
    }

    /* Decorative corners */
    .corner {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 3px solid #d4af37;
      opacity: 0.85;
    }
    .corner.tl { top: 12px; left: 12px; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
    .corner.tr { top: 12px; right: 12px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
    .corner.bl { bottom: 12px; left: 12px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
    .corner.br { bottom: 12px; right: 12px; border-left: none; border-top: none; border-radius: 0 0 8px 0; }

    /* Ornate lines */
    .ornament {
      position: absolute;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .gift-icon {
      font-size: 36px;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 8px rgba(212,175,55,0.6));
    }

    .title-bn {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f5e6b8;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
      margin-bottom: 4px;
    }

    .title-en {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      letter-spacing: 6px;
      color: #d4af37;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .amount {
      font-size: 64px;
      font-weight: 700;
      color: #ffd700;
      text-shadow: 0 3px 15px rgba(0,0,0,0.5);
      margin: 10px 0 25px;
      letter-spacing: 2px;
    }

    .fields {
      display: flex;
      justify-content: space-between;
      width: 80%;
      margin-bottom: 22px;
      font-size: 16px;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field span {
      color: #d4af37;
      font-weight: 600;
    }

    .line {
      width: 140px;
      border-bottom: 1.5px solid #d4af37;
      opacity: 0.7;
    }

    .valid {
      font-size: 14px;
      color: #e8d48b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .code {
      background: rgba(0,0,0,0.25);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: #ffd700;
      border: 1px solid rgba(212,175,55,0.4);
    }

    /* Sparkles */
    .sparkle {
      position: absolute;
      color: #ffd700;
      font-size: 14px;
      opacity: 0.7;
    }
    .s1 { top: 70px; left: 80px; }
    .s2 { top: 90px; right: 100px; }
    .s3 { bottom: 100px; left: 120px; }
    .s4 { bottom: 80px; right: 90px; }
  </style>
</head>
<body>
  <div class="voucher">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✦</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✦</div>

    <div class="content">
      <div class="gift-icon">🎁</div>
      <div class="title-bn">গিফট ভাউচার</div>
      <div class="title-en">Gift Voucher</div>
      
      <div class="amount">৳ ১০০</div>

      <div class="fields">
        <div class="field">
          <span>To:</span>
          <div class="line"></div>
        </div>
        <div class="field">
          <span>From:</span>
          <div class="line"></div>
        </div>
      </div>

      <div class="valid">
        🛡 Valid for any purchase
      </div>

      <div class="code">GV-BD-100-X7K9</div>
    </div>
  </div>
</body>
</html>
